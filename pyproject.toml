[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soft-copyright-docs"
version = "1.0.0"
description = "从源码目录一键生成软件著作权登记所需的四份材料：源程序文档、软件说明书、用户操作手册、界面截图文档"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["软著", "软件著作权", "copyright", "docx", "python-docx"]
dependencies = [
    "python-docx>=1.1",
]

[project.scripts]
ruanzhu = "ruanzhu.__main__:main"

[tool.setuptools]
packages = ["ruanzhu"]
